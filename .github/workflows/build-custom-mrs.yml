name: Build Mihomo MRS and Happ geodata

on:
  push:
    branches:
      - main
    paths:
      - "rules/custom_proxy.txt"
      - "rules/custom_local.txt"
      - "rules/apps_proxy.txt"
      - "rules/apps_local.txt"
      - "scripts/build_custom_rule_sources.py"
      - "scripts/build_app_rule_sources.py"
      - "scripts/build_happ_geodata_sources.py"
      - "scripts/test_build_happ_geodata_sources.py"
      - "geodata/**"
      - ".github/workflows/build-custom-mrs.yml"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go for geodata builders
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: false

      - name: Generate text rulesets
        run: |
          python3 scripts/build_custom_rule_sources.py \
            --proxy-input rules/custom_proxy.txt \
            --local-input rules/custom_local.txt \
            --out-dir build

          python3 scripts/build_happ_geodata_sources.py \
            --proxy-input rules/custom_proxy.txt \
            --local-input rules/custom_local.txt \
            --out-dir build/happ

          python3 -m unittest scripts/test_build_happ_geodata_sources.py

      - name: Download mihomo
        run: |
          set -euo pipefail

          ASSET="$(gh release view \
            --repo MetaCubeX/mihomo \
            --json assets \
            --jq '[.assets[]
              | select(.name | test("^mihomo-linux-amd64-v[0-9].*\\.gz$"))
              | select(.name | contains("compatible") | not)
              | select(.name | contains("go120") | not)
              | .name][0]')"

          echo "Selected asset: $ASSET"

          if [ -z "$ASSET" ] || [ "$ASSET" = "null" ]; then
            echo "No suitable mihomo linux amd64 asset found"
            exit 1
          fi

          gh release download \
            --repo MetaCubeX/mihomo \
            --pattern "$ASSET" \
            --output mihomo.gz

          gzip -d mihomo.gz
          chmod +x mihomo

          ./mihomo -v
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Convert to MRS
        run: |
          set -euo pipefail

          mkdir -p generated

          ./mihomo convert-ruleset domain text \
            build/custom-proxy-domains.txt \
            generated/custom-proxy-domains.mrs

          ./mihomo convert-ruleset ipcidr text \
            build/custom-proxy-ipcidr.txt \
            generated/custom-proxy-ipcidr.mrs

          ./mihomo convert-ruleset domain text \
            build/custom-local-domains.txt \
            generated/custom-local-domains.mrs

          ./mihomo convert-ruleset ipcidr text \
            build/custom-local-ipcidr.txt \
            generated/custom-local-ipcidr.mrs

          ls -lh generated

      # Правила по процессам — classical/text, mihomo convert-ruleset их не берёт
      # (.mrs только domain/ipcidr), поэтому просто генерим .list напрямую.
      - name: Build app process rulesets
        run: |
          set -euo pipefail

          python3 scripts/build_app_rule_sources.py \
            --proxy-input rules/apps_proxy.txt \
            --local-input rules/apps_local.txt \
            --out-dir generated

          ls -lh generated

      - name: Build Happ geosite.dat and geoip.dat
        run: |
          set -euo pipefail

          git clone --depth 1 \
            https://github.com/KazZzeL/geomixer.git \
            build/geomixer
          cd build/geomixer
          go build -o "${GITHUB_WORKSPACE}/build/geomixer-bin" ./
          cd "${GITHUB_WORKSPACE}"

          ./build/geomixer-bin mix geodata/happ-geomixer.yaml -o generated
          test -s generated/happ-geosite.dat
          test -s generated/happ-geoip.dat

          GEOSITE_SIZE="$(stat -c '%s' generated/happ-geosite.dat)"
          GEOSITE_MAX_SIZE=$((4 * 1024 * 1024))
          if [ "$GEOSITE_SIZE" -gt "$GEOSITE_MAX_SIZE" ]; then
            echo "happ-geosite.dat is ${GEOSITE_SIZE} bytes; iOS safety ceiling is ${GEOSITE_MAX_SIZE}"
            exit 1
          fi

          ls -lh generated/happ-geosite.dat generated/happ-geoip.dat

      # Публикуем в release ЭТОГО (публичного) репо — оттуда MRS/geodata тянут клиенты.
      # Репо и релиз совпадают со сборкой, поэтому хватает встроенного GITHUB_TOKEN
      # (permissions: contents: write выше). Тег/релиз custom-mrs уже существуют.
      - name: Publish generated routing assets to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload custom-mrs \
            --repo ${{ github.repository }} \
            --clobber \
            generated/custom-proxy-domains.mrs \
            generated/custom-proxy-ipcidr.mrs \
            generated/custom-local-domains.mrs \
            generated/custom-local-ipcidr.mrs \
            generated/custom-apps-proxy.list \
            generated/custom-apps-local.list \
            generated/happ-geosite.dat \
            generated/happ-geoip.dat
